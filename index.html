<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Changa+One:ital@0;1&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
    <title>Tassen</title>
</head>

<body>
    <header>
        <div class="navBox">
            <div class="leftGroup">
                <img src="Images/image-removebg-preview.png" alt="logo">
                <div class="headerTextArea">
                    <h1>Tassen</h1>
                    <h3>Hundpensionat & Hunddagis</h3>
                </div>
            </div>
            <nav>
                <button>Hem</button>
                <button>Tjänster</button>
                <button>Öppettider</button>
                <button>Boka</button>
                <button>Om oss</button>
                <button>Kontakt</button>
            </nav>
        </div>
    </header>

    <main>
        <section class="services">
            <label>Våra Tjänster</label>
            <div class="cards-box">
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
            </div>
        </section>
        <section class="timeOpen">
            <div class="openCard">
                <label class="openCardHeader" id="openHeading">Just nu: Laddar...</label>
                <div class="openCardTime">
                    <label class="counter" id="counter">LocalTime</label>
                    <div class="cardWall"></div>
                    <label class="date" id="date">LocalDate</label>
                </div>
                <div class="openCardButton">
                    <div></div> <label id="isOpenButton">Öppet just nu</label>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
